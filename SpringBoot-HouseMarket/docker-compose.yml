name: housemarket

services:
  mysql:
    image: mysql:8.0
    container_name: housemarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: housemarket
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - housemarket-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: housemarket-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - housemarket-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: housemarket-backend:latest
    container_name: housemarket-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/housemarket?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-DnYFooRaZqdDXLi6GZQ4210ksbgDV3PTZQGa35OZNXJQIt6hGankli3gt6/cT6fP}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/api/public/stats >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: housemarket-frontend:latest
    container_name: housemarket-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  housemarket-mysql-data:
    name: housemarket-mysql-data
  housemarket-redis-data:
    name: housemarket-redis-data
