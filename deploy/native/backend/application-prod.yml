# ============================================================
# HouseMarket 生产环境外置配置（原生部署使用）
# 通过 --spring.config.additional-location=application-prod.yml 加载
# 所有敏感信息均在此文件配置，不要提交到 Git
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/housemarket?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: housemarket
    password: changeme_strong_password
  # 生产环境使用 Redis 缓存（如果不需要可改为 simple）
  cache:
    type: redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:               # 如 Redis 设置了密码请填写

server:
  port: 8082

# JWT 密钥：必须通过环境变量或在此处设置（Base64，至少 256 位）
# 生成命令：openssl rand -base64 48
jwt:
  secret: ${JWT_SECRET:}
  expiration-hours: 10

# 跨域白名单：生产环境务必改为真实域名
app:
  cors:
    allowed-origins: https://house.evezero.cn,https://www.house.evezero.cn

# 上传目录（绝对路径，确保服务用户有写权限）
upload:
  dir: /opt/housemarket/uploads

# 生产关闭 Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.springboot.springboothousemarket: INFO
