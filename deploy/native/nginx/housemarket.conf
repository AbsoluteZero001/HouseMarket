# ============================================================
# HouseMarket 生产环境 Nginx 配置
# 安装路径建议：/etc/nginx/conf.d/housemarket.conf
# ============================================================

# HTTP -> HTTPS 重定向（启用 SSL 后取消注释）
# server {
#     listen 80;
#     server_name house.evezero.cn www.house.evezero.cn;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # 启用 SSL 时改为：listen 443 ssl http2;
    server_name house.evezero.cn www.house.evezero.cn;

    # SSL 证书配置（启用 HTTPS 时取消注释并替换路径）
    # ssl_certificate     /etc/nginx/ssl/house.evezero.cn.pem;
    # ssl_certificate_key /etc/nginx/ssl/house.evezero.cn.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态资源
    root /opt/housemarket/frontend/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 静态资源长缓存（带 hash 的构建产物）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 用户接口
    location /user/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger（生产已在后端关闭，此处保留代理以备调试）
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }
    location /v3/api-docs/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
