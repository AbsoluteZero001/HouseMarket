name: housemarket

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: housemarket
      TZ: Asia/Shanghai
    volumes:
      - housemarket-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - housemarket-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: housemarket-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/housemarket?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 生产环境必须提供强随机 JWT_SECRET（Base64，>=32字节）；缺失时 compose 直接报错停止
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-10}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://house.evezero.cn}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
      # 数据库迁移：由 Flyway 在应用启动时自动执行增量结构变更（不要再手工执行 SQL）
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      # 实名认证审核 SLA（小时）与超时自动拒绝开关
      IDENTITY_VERIFY_EXPIRE_HOURS: ${IDENTITY_VERIFY_EXPIRE_HOURS:-72}
      IDENTITY_VERIFY_EXPIRY_ENABLED: ${IDENTITY_VERIFY_EXPIRY_ENABLED:-true}
      # 通知归档保留天数（已读 / 未读）
      NOTIFICATION_ARCHIVE_ENABLED: ${NOTIFICATION_ARCHIVE_ENABLED:-true}
      NOTIFICATION_ARCHIVE_DAYS: ${NOTIFICATION_ARCHIVE_DAYS:-90}
      NOTIFICATION_ARCHIVE_UNREAD_DAYS: ${NOTIFICATION_ARCHIVE_UNREAD_DAYS:-365}
      # 登录/注册限流：用户名维度 / IP 维度 / 统计窗口（秒）
      RATELIMIT_LOGIN_USER_LIMIT: ${RATELIMIT_LOGIN_USER_LIMIT:-5}
      RATELIMIT_LOGIN_IP_LIMIT: ${RATELIMIT_LOGIN_IP_LIMIT:-30}
      RATELIMIT_REGISTER_USER_LIMIT: ${RATELIMIT_REGISTER_USER_LIMIT:-5}
      RATELIMIT_REGISTER_IP_LIMIT: ${RATELIMIT_REGISTER_IP_LIMIT:-20}
      RATELIMIT_WINDOW_SECONDS: ${RATELIMIT_WINDOW_SECONDS:-60}
      # 是否信任 X-Forwarded-For：应用在 Nginx 之后必须为 true，否则 IP 维度限流会误伤全部用户
      RATELIMIT_TRUST_PROXY_HEADERS: ${RATELIMIT_TRUST_PROXY_HEADERS:-true}
    volumes:
      - housemarket-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/api/public/stats >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: housemarket-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  housemarket-mysql-data:
    name: housemarket-mysql-data
  housemarket-redis-data:
    name: housemarket-redis-data
  housemarket-uploads:
    name: housemarket-uploads
